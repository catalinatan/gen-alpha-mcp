[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-alpha-mcp"
version = "0.1.0"
description = "MCP server for Gen Alpha golden set evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.49",
    "httpx>=0.27",
    "mcp>=1.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "sqlite-utils>=3.36",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8"]

[project.scripts]
gab = "gab.cli:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
packages = ["gab", "server"]
py-modules = ["cli"]
