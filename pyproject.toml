[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gen-alpha-mcp"
version = "0.1.0"
description = "MCP server for Gen Alpha golden set evaluations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.49",
    "httpx>=0.27",
    "mcp>=1.0",
    "pydantic>=2",
    "sqlite-utils>=3.36",
]

[tool.setuptools]
packages = ["gab", "server"]
py-modules = ["cli", "store"]
